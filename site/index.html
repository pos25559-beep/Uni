<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-->
    <script>
      (function () {
        var m = window.matchMedia('(prefers-color-scheme: dark)');
        var set = function () { document.documentElement.classList.toggle('dark', m.matches); };
        set();
        m.addEventListener ? m.addEventListener('change', set) : m.addListener(set);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
