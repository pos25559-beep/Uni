<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-->
    <script>
      // Tema: o que o visitante escolheu (guardado) ou, por omissão, o do sistema.
      (function () {
        var m = window.matchMedia('(prefers-color-scheme: dark)');
        var saved = null;
        try { saved = localStorage.getItem('unipedia-site-theme'); } catch (e) {}
        var apply = function () {
          var dark = saved ? saved === 'dark' : m.matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var tc = document.querySelector('meta[name=theme-color]');
          if (tc) tc.setAttribute('content', dark ? '#141311' : '#FAF8F2');
        };
        apply();
        var onChange = function () { try { saved = localStorage.getItem('unipedia-site-theme'); } catch (e) {} if (!saved) apply(); };
        m.addEventListener ? m.addEventListener('change', onChange) : m.addListener(onChange);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
