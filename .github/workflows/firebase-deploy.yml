name: Deploy Firebase Hosting & Rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: true

jobs:
  verify_and_deploy:
    name: Verify & Deploy to Firebase (campus-erp-84964)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile || bun install --no-save
          elif [ -f package-lock.json ]; then
            npm ci || bun install --no-save
          else
            bun install --no-save
          fi

      - name: Verify 4-locale i18n parity
        run: npm run i18n:report

      - name: Typecheck, Lint, UI Guard, Tests & Build
        run: npm run check

      - name: Deploy Hosting & Firestore Rules
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAMPUS_ERP_84964 }}
        run: |
          if [ -z "${FIREBASE_SA_JSON:-}" ]; then
            echo "::error::O secret FIREBASE_SERVICE_ACCOUNT_CAMPUS_ERP_84964 não está configurado nas definições do repositório GitHub. Configure-o para o deploy no Firebase acontecer."
            exit 1
          fi
          SA_FILE="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "$FIREBASE_SA_JSON" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx --yes firebase-tools deploy \
            --only hosting,firestore:rules \
            --project campus-erp-84964 \
            --non-interactive

      - name: Clean temporary credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/firebase-sa.json"
